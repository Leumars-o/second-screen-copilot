[workspace]
resolver = "3"
members = ["crates/*", "apps/agent", "bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
ssc-core = { path = "crates/ssc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "1"
jsonschema = { version = "0.61", default-features = false }
rusqlite = { version = "0.43", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
