# Second Screen Copilot blind relay. Self-host with `wrangler deploy` (see README.md).
name = "ssc-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# One Durable Object per room. SQLite-backed so it runs on the Workers free plan.
# The relay stores no content: the only persisted state is the 24 h expiry alarm.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

# Optional overrides (all strings). Defaults live in src/frame.ts.
# [vars]
# RATE_FRAMES_PER_SEC = "100"
# RATE_BURST_FRAMES = "200"
# RATE_BYTES_PER_SEC = "524288"
# RATE_BURST_BYTES = "1048576"
# ROOM_IDLE_MS = "86400000"
