[package]
name = "ssc-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bench harnesses (Build Sheet §7 W2-BENCH): latency, ttft, stt, decision, cpu, answers."

[[bin]]
name = "ssc-bench"
path = "src/main.rs"

[features]
default = []
# `--live` modes: real providers, keys from the OS keychain. Never built or run by the gate.
live = []
# Local whisper.cpp for `stt --live` (needs cmake; see crates/ssc-stt).
local-stt = ["ssc-stt/local-stt"]

[dependencies]
ssc-core.workspace = true
ssc-router = { path = "../crates/ssc-router" }
ssc-context = { path = "../crates/ssc-context" }
ssc-stt = { path = "../crates/ssc-stt" }
ssc-audio = { path = "../crates/ssc-audio" }
ssc-pipeline = { path = "../crates/ssc-pipeline" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-util.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hound = "3.5"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
