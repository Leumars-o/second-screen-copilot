[package]
name = "ssc-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "PC side of the phone link: LAN WebSocket (+ wss with a Let's Encrypt cert) + mDNS, relay fallback, batching, heartbeats."

[dependencies]
ssc-core.workspace = true
ssc-crypto = { path = "../ssc-crypto" }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
async-trait.workspace = true
uuid.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# native-tls: Schannel on Windows, Security.framework on macOS (no C toolchain for cross checks).
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
mdns-sd = "0.21"
if-addrs = "0.15"
# CR-4 LAN wss: Cloudflare DNS + ACME DNS-01 + rustls server. One crypto provider (ring) in the tree.
serde.workspace = true
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
x509-parser = "0.18"

[dev-dependencies]
tokio = { workspace = true, features = ["net", "test-util"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"
time = "0.3"
native-tls = "0.2"

[features]
# Live Cloudflare + Let's Encrypt *staging* test (needs `api.cloudflare` in the keychain).
live = []

[lints]
workspace = true
