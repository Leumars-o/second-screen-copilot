[package]
name = "ssc-screen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Focused-window screen reader (UI Automation / AXUIElement, OCR fallback) and screen diff."

[dependencies]
ssc-core.workspace = true
anyhow.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.25"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Media_Ocr", "Graphics_Imaging", "Foundation", "Foundation_Collections", "Globalization", "Storage_Streams"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"
objc2 = "0.6"
# Same pin as ssc-audio (newer versions pull apple-metal, which fails to build here).
# `macos_15_2` enables SCScreenshotManager.captureImage(in:) (checked at runtime too).
screencapturekit = { version = "2.1", features = ["macos_15_2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSObject", "NSEnumerator"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBase", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGGeometry", "CGImage", "CGWindow"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNRequestRevisionProviding", "VNTypes", "objc2-core-foundation", "objc2-core-graphics"] }

[lints]
workspace = true
