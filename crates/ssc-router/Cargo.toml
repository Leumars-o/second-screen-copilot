[package]
name = "ssc-router"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Answer/decision model adapters, deterministic routing and failover, cue output parser."

[features]
# Live-provider tests (real network, real keys from the OS keychain). Never run by the gate.
live = []

[dependencies]
ssc-core.workspace = true
ssc-redact = { path = "../ssc-redact" }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }

[lints]
workspace = true
